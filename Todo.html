<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A sleek, modern to-do list app to manage your daily tasks efficiently.">
    <title>To-Do List — Stay Organized</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="todo" aria-label="To-Do List Application">
        <section class="container" aria-label="Task Manager">
            <header>
                <h1>To-Do List</h1>
                <p class="subtitle">Organize your day, one task at a time</p>
            </header>
            <div class="input-group">
                <input type="text" id="task-input" placeholder="What needs to be done?" aria-label="New task" autocomplete="off">
                <button id="add-task-btn" aria-label="Add task">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Add
                </button>
            </div>
            <div class="task-count" id="task-count" aria-live="polite"></div>
            <div class="ulist">
                <ul id="task-list" role="list"></ul>
                <div class="empty-state" id="empty-state">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                    <p>No tasks yet — add one above!</p>
                </div>
            </div>
        </section>
        <section class="history-container" aria-label="Deleted Tasks History">
            <div class="history-header">
                <h2>🗑️ Deleted History</h2>
                <button id="clear-history-btn" aria-label="Clear all deleted task history">Clear All</button>
            </div>
            <div class="history-list">
                <ul id="deleted-tasks-list" role="list"></ul>
                <div class="empty-history" id="empty-history">
                    <p>No deleted tasks</p>
                </div>
            </div>
        </section>
    </main>
    
    <footer class="app-footer">
        <p>Made with ❤️ by ARShaikh0801</p>
    </footer>

    <script src="scripts.js"></script>
</body>

</html>
